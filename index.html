<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Quiz</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #120924;
            --panel-bg: #23153b;
            --panel-bg-light: #2d1b4a;
            --primary-color: #c724ff;
            --primary-glow: rgba(199, 36, 255, 0.5);
            --text-color: #ffffff;
            --text-muted: #a08fb5;
            --coin-color: #f1c40f;
            --border-color: #3d235e;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #2a0f4a, transparent 50%),
                              radial-gradient(circle at bottom left, #1a0b2e, transparent 50%);
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            position: relative;
            flex-direction: column;
        }
        .screen.active { display: flex; }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px 30px;
            gap: 30px;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
        }

        .detective-container {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .pulse-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(199, 36, 255, 0.2) 0%, rgba(199, 36, 255, 0) 70%);
            border: 2px solid var(--primary-color);
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
            z-index: 1;
            box-shadow: 0 0 15px rgba(199, 36, 255, 0.3);
        }

        .detective-emoji {
            font-size: 5rem;
            z-index: 2;
            transform: translateY(0);
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(199, 36, 255, 0.7); }
            70% { transform: scale(1.1); opacity: 0.8; box-shadow: 0 0 0 20px rgba(199, 36, 255, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(199, 36, 255, 0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-area h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 5px 0;
            text-shadow: 0 0 20px var(--primary-glow), 0 0 40px var(--primary-glow);
            background: linear-gradient(180deg, #fff, #d4b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0;
        }

        .btn-primary {
            background: linear-gradient(90deg, #d022ff, #a31ad6);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px var(--primary-glow);
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.97); }

        .menu-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-secondary:active { background: rgba(255, 255, 255, 0.1); }
        .btn-secondary svg { flex-shrink: 0; }

        .btn-shop svg { color: #26c6da; }
        .btn-settings svg { color: #555555; }
        .btn-help svg { color: #5d4037; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            flex-direction: row-reverse;
        }
        .header h2 { font-size: 1.3rem; }
        .btn-back {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-back svg { width: 24px; height: 24px; }

        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
        }
        .chapter-card {
            background: var(--panel-bg);
            border-radius: 25px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .chapter-card:active { transform: scale(0.98); }
        .chapter-card.locked { opacity: 0.6; cursor: not-allowed; }
        .chapter-card.active {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(199, 36, 255, 0.2);
        }
        .chapter-card h3 { font-size: 1.3rem; }
        .chapter-card p { font-size: 0.75rem; color: var(--text-muted); }

        .chapter-card .lock-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            margin-top: auto;
        }
        .chapter-card .lock-icon svg { width: 28px; height: 28px; }

        .chapter-progress {
            margin-top: 6px;
            position: relative;
            width: 44px;
            height: 44px;
        }
        .chapter-progress svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .chapter-progress .progress-track {
            stroke: rgba(255, 255, 255, 0.08);
        }
        .chapter-progress .progress-value {
            stroke: var(--primary-color);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
            filter: drop-shadow(0 0 4px var(--primary-glow));
        }
        .chapter-progress .progress-text-sm {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.6rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .progress-container {
            padding: 0 20px 15px;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .progress-text span:last-child { color: var(--text-muted); }
        .progress-bar {
            height: 6px;
            background: var(--panel-bg);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
        }
        .level-card {
            aspect-ratio: 1;
            background: var(--panel-bg);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }
        .level-card.locked {
            opacity: 0.3;
            cursor: not-allowed;
            flex-direction: column;
            gap: 3px;
        }
        .level-card.locked .lock-icon svg { width: 18px; height: 18px; }
        .level-card.completed { border-color: var(--success-color); }

        .level-card.completed .level-completed-icon {
            position: absolute;
            bottom: -4px;
            left: -4px;
            color: var(--success-color);
            background: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
        }
        .level-card.completed .level-completed-icon svg {
            width: 18px;
            height: 18px;
        }

        .level-card.active-level {
            border-color: var(--primary-color);
            background: rgba(199, 36, 255, 0.1);
            box-shadow: 0 0 15px rgba(199, 36, 255, 0.3);
            color: var(--primary-color);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            flex-direction: row-reverse;
        }
        .level-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.9rem;
        }
        .level-info span:first-child { color: var(--text-muted); font-size: 0.8rem; }

        .coin-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .coin-icon { display: flex; align-items: center; color: var(--coin-color); }
        .coin-icon svg { width: 18px; height: 18px; }
        #game-coins {
            color: var(--coin-color);
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
        }

        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 20px 0;
            gap: 20px;
            overflow: hidden;
        }

        .emoji-board {
            background: var(--panel-bg);
            width: 100%;
            height: 140px;
            border-radius: 30px;
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: center;
            gap: 30px;
            font-size: 4.5rem;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .hints-row {
            display: flex;
            flex-direction: row-reverse;
            gap: 10px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .btn-hint {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }
        .btn-hint:active { background: var(--panel-bg-light); }

        .btn-hint .cost {
            color: var(--coin-color);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
            width: 100%;
        }

        .btn-hint .hint-icon { display: flex; align-items: center; justify-content: center; }
        .btn-hint .hint-icon svg { width: 22px; height: 22px; }
        .btn-hint .cost svg { width: 14px; height: 14px; }

        .btn-hint[data-hint="reveal"] .hint-icon { color: #2196f3; }
        .btn-hint[data-hint="remove"] .hint-icon { color: #f44336; }
        .btn-hint[data-hint="letter"] .hint-icon { color: #ff9800; }

        .answer-slots {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .slot {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .slot:active { background: rgba(255,255,255,0.1); }

        .slot-spacer {
            width: 20px;
            height: 48px;
            flex-shrink: 0;
        }

        .keyboard {
            background: #0d0518;
            padding: 15px 10px 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            margin-top: auto;
            flex-shrink: 0;
        }
        .key {
            width: calc(10% - 6px);
            min-width: 32px;
            height: 45px;
            background: var(--panel-bg-light);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            border-bottom: 3px solid #11051f;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:active { transform: translateY(2px); border-bottom-width: 1px; }
        .key.used { opacity: 0.2; pointer-events: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e1233;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            width: 85%;
            max-width: 350px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .modal-icon { font-size: 5rem; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .modal-content h2 { color: var(--coin-color); font-size: 1.3rem; margin-bottom: 15px; }
        .modal-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .correct-answer {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .reward { color: var(--coin-color); font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .reward svg { width: 18px; height: 18px; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <div id="main-menu" class="screen active">
        <div class="menu-content">
            <div class="logo-area">
                <div class="detective-container">
                    <div class="pulse-circle"></div>
                    <div class="detective-emoji">🕵️</div>
                </div>
                <h1>Emoji Quiz</h1>
                <p>ذهن خود را به چالش بکشید!</p>
            </div>
            <button id="btn-start" class="btn-primary">شروع بازی</button>
            <div class="menu-buttons">
                <button class="btn-secondary btn-shop">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
                    فروشگاه
                </button>
                <button class="btn-secondary btn-settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                    تنظیمات
                </button>
                <button class="btn-secondary btn-help">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
                    راهنما
                </button>
            </div>
        </div>
    </div>

<div id="chapters-screen" class="screen">
    <div class="header">
        <button class="btn-back" onclick="showScreen('main-menu')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>
        </button>
        <h2>فصل های بازی</h2>
    </div>
    <div class="chapters-grid" id="chapters-grid"></div>
</div>

    <div id="levels-screen" class="screen">
        <div class="header">
            <button class="btn-back" onclick="showScreen('chapters-screen')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>
            </button>
            <h2 id="level-header-title">فصل ۱</h2>
        </div>
        <div class="progress-container">
            <div class="progress-text">
                <span>پیشرفت کل:</span>
                <span id="progress-text">0 از 15 مرحله حل شده</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>

    <div id="game-screen" class="screen">
        <div class="game-header">
            <button class="btn-back" onclick="showScreen('levels-screen')">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>
            </button>
            <div class="level-info">
                <span id="game-chapter">فصل 1</span>
                <span id="game-level">مرحله 1</span>
            </div>
            <div class="coin-wrapper">
                <span class="coin-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                </span>
                <span id="game-coins">50</span>
            </div>
        </div>

        <div class="game-main">
            <div class="emoji-board" id="emoji-question"></div>

            <div class="hints-row">
                <button class="btn-hint" data-hint="reveal" onclick="buyHint('reveal')">
                    <span class="hint-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span>نمایش جواب</span>
                    <span class="cost">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                        50
                    </span>
                </button>
                <button class="btn-hint" data-hint="remove" onclick="buyHint('remove')">
                    <span class="hint-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
                    </span>
                    <span>حذف اضافی</span>
                    <span class="cost">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                        25
                    </span>
                </button>
                <button class="btn-hint" data-hint="letter" onclick="buyHint('letter')">
                    <span class="hint-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                    </span>
                    <span>حرف اول</span>
                    <span class="cost">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                        5
                    </span>
                </button>
            </div>

            <div class="answer-slots" id="answer-slots"></div>
        </div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <div id="win-modal" class="modal">
    <div class="modal-content">
        <h2>درست حدس زدی! 🎉</h2>
        <p class="modal-subtitle">پاسخ صحیح:</p>
        <div class="correct-answer" id="correct-answer-text"></div>
        <div class="reward" style="color: var(--success-color);">10 سکه دریافت کردید.</div>
        <button class="btn-primary" onclick="nextLevel()">مرحله بعدی ⬅</button>
    </div>
    </div>

    <script>
        const gameData = [
            // ===== فصل ۱: مراحل ۱ تا ۱۵ =====
            { id: 1, emojis: ['🧑', '🐬'], answer: 'پسر دلفینی', letters: ['پ','س','ر',' ','د','ل','ف','ی','ن','ی'] },
            { id: 2, emojis: ['🌅', '🧊'], answer: 'عصر یخبندان', letters: ['ع','ص','ر',' ','ی','خ','ب','ن','د','ا','ن'] },
            { id: 3, emojis: ['🐁', '👨‍🍳'], answer: 'موش سرآشپز', letters: ['م','و','ش',' ','س','ر','آ','ش','پ','ز'] },
            { id: 4, emojis: ['🐈‍⬛', '👢'], answer: 'گربه چکمه پوش', letters: ['گ','ر','ب','ه',' ','چ','ک','م','ه',' ','پ','و','ش'] },
            { id: 5, emojis: ['📚', '🌾'], answer: 'دانشجو', letters: ['د','ا','ن','ش','ج','و'] },
            { id: 6, emojis: ['✋️', '💰'], answer: 'دستمال', letters: ['د','س','ت','م','ا','ل'] },
            { id: 7, emojis: ['🏙', '✉️'], answer: 'روزنامه', letters: ['ر','و','ز','ن','ا','م','ه'] },
            { id: 8, emojis: ['🦷', '🍞'], answer: 'دندان', letters: ['د','ن','د','ا','ن'] },
            { id: 9, emojis: ['🧊', '🕳'], answer: 'یخچال', letters: ['ی','خ','چ','ا','ل'] },
            { id: 10, emojis: ['🦶', '🛏'], answer: 'پایتخت', letters: ['پ','ا','ی','ت','خ','ت'] },
            { id: 11, emojis: ['🚕', '👫'], answer: 'آژانس دوستی', letters: ['آ','ژ','ا','ن','س',' ','د','و','س','ت','ی'] },
            { id: 12, emojis: ['🎶', '🌧'], answer: 'آوای باران', letters: ['آ','و','ا','ی',' ','ب','ا','ر','ا','ن'] },
            { id: 13, emojis: ['🔧', '🇮🇷'], answer: 'ساخت ایران', letters: ['س','ا','خ','ت',' ','ا','ی','ر','ا','ن'] },
            { id: 14, emojis: ['🌹', '💧'], answer: 'گلاب', letters: ['گ','ل','ا','ب'] },
            { id: 15, emojis: ['🩸', '🥶'], answer: 'خون سرد', letters: ['خ','و','ن',' ','س','ر','د'] },
            // ===== فصل ۲: مراحل ۱۶ تا ۳۰ =====
            { id: 16, emojis: ['🛶', '🍗'], answer: 'قایقران', letters: ['ق','ا','ی','ق','ر','ا','ن'] },
            { id: 17, emojis: ['👔', '💧'], answer: 'کتاب', letters: ['ک','ت','ا','ب'] },
            { id: 18, emojis: ['🎲', '🥓'], answer: 'تاس کباب', letters: ['ت','ا','س',' ','ک','ب','ا','ب'] },
            { id: 19, emojis: ['🍜', '🏔'], answer: 'رشته کوه', letters: ['ر','ش','ت','ه',' ','ک','و','ه'] },
            { id: 20, emojis: ['🚗', '🛁'], answer: 'کاروان', letters: ['ک','ا','ر','و','ا','ن'] },
            { id: 21, emojis: ['💧', '🍋'], answer: 'آبلیمو', letters: ['آ','ب','ل','ی','م','و'] },
            { id: 22, emojis: ['🗣', '🍗'], answer: 'سخنران', letters: ['س','خ','ن','ر','ا','ن'] },
            { id: 23, emojis: ['👖', '🛁'], answer: 'لیوان', letters: ['ل','ی','و','ا','ن'] },
            { id: 24, emojis: ['🌷', '😭'], answer: 'لاله زار', letters: ['ل','ا','ل','ه',' ','ز','ا','ر'] },
            { id: 25, emojis: ['👨‍🦯', '🎨'], answer: 'کور رنگی', letters: ['ک','و','ر',' ','ر','ن','گ','ی'] },
            { id: 26, emojis: ['🪵', '🧂'], answer: 'چوب شور', letters: ['چ','و','ب',' ','ش','و','ر'] },
            { id: 27, emojis: ['🚪', '🚚'], answer: 'دربار', letters: ['د','ر','ب','ا','ر'] },
            { id: 28, emojis: ['🥛', '🍌'], answer: 'شیر موز', letters: ['ش','ی','ر',' ','م','و','ز'] },
            { id: 29, emojis: ['🥚', '🐔'], answer: 'تخم مرغ', letters: ['ت','خ','م',' ','م','ر','غ'] },
            { id: 30, emojis: ['🔩', '🥩'], answer: 'پیچ گوشتی', letters: ['پ','ی','چ',' ','گ','و','ش','ت','ی'] },
            // ===== فصل ۳: مراحل ۳۱ تا ۴۵ =====
            { id: 31, emojis: ['🌞', '🌻'], answer: 'آفتابگردان', letters: ['آ','ف','ت','ا','ب','گ','ر','د','ا','ن'] },
            { id: 32, emojis: ['🤴', '🗝'], answer: 'شاه کلید', letters: ['ش','ا','ه',' ','ک','ل','ی','د'] },
            { id: 33, emojis: ['🌹', '🏠'], answer: 'گلخانه', letters: ['گ','ل','خ','ا','ن','ه'] },
            { id: 34, emojis: ['💧', '🏔'], answer: 'آب معدنی', letters: ['آ','ب',' ','م','ع','د','ن','ی'] },
            { id: 35, emojis: ['👞', '🪡'], answer: 'کفشدوزک', letters: ['ک','ف','ش','د','و','ز','ک'] },
            { id: 36, emojis: ['🪨', '🪦'], answer: 'سنگ قبر', letters: ['س','ن','گ',' ','ق','ب','ر'] },
            { id: 37, emojis: ['🫀', '📜'], answer: 'دل نوشته', letters: ['د','ل',' ','ن','و','ش','ت','ه'] },
            { id: 38, emojis: ['🛞', '🧵'], answer: 'چرخ خیاطی', letters: ['چ','ر','خ',' ','خ','ی','ا','ط','ی'] },
            { id: 39, emojis: ['👓', '🌞'], answer: 'عینک آفتابی', letters: ['ع','ی','ن','ک',' ','آ','ف','ت','ا','ب','ی'] },
            { id: 40, emojis: ['🔦', '💪'], answer: 'چراغ قوه', letters: ['چ','ر','ا','غ',' ','ق','و','ه'] },
            { id: 41, emojis: ['🧹', '⚡️'], answer: 'جارو برقی', letters: ['ج','ا','ر','و',' ','ب','ر','ق','ی'] },
            { id: 42, emojis: ['💡', '😴'], answer: 'چراغ خواب', letters: ['چ','ر','ا','غ',' ','خ','و','ا','ب'] },
            { id: 43, emojis: ['☕️', '🔥'], answer: 'قهوه جوش', letters: ['ق','ه','و','ه',' ','ج','و','ش'] },
            { id: 44, emojis: ['🌹', '🧑'], answer: 'گل پسر', letters: ['گ','ل',' ','پ','س','ر'] },
            { id: 45, emojis: ['🕒', '🧱'], answer: 'ساعت دیواری', letters: ['س','ا','ع','ت',' ','د','ی','و','ا','ر','ی'] }
        ];

        let currentLevelIndex = 0;
        let storedCoins = localStorage.getItem('emojiGameCoins');
        let currentCoins = storedCoins !== null ? parseInt(storedCoins) : 50;
        let currentWord = [];
        let currentGuess = [];
        let unlockedLevels = parseInt(localStorage.getItem('emojiGameUnlocked')) || 1;
        const TOTAL_LEVELS = 45;
        const LEVELS_PER_CHAPTER = 15;
        const TOTAL_CHAPTERS = 3;

        const ICONS = {
            lock: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>`,
            check: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-check"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>`
        };

        function updateCoinsUI() {
            document.getElementById('game-coins').innerText = currentCoins;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(screenId === 'levels-screen') {
                renderLevels();
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            renderChapters();
            showScreen('chapters-screen');
        });

        function buildProgressRing(percent) {
            const radius = 18;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percent / 100) * circumference;
            return `
                <div class="chapter-progress">
                    <svg viewBox="0 0 44 44">
                        <circle class="progress-track" cx="22" cy="22" r="${radius}" stroke-width="4" fill="none"/>
                        <circle class="progress-value" cx="22" cy="22" r="${radius}" stroke-width="4" fill="none"
                                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
                    </svg>
                    <span class="progress-text-sm">${Math.round(percent)}%</span>
                </div>
            `;
        }

        function renderChapters() {
            const chaptersGrid = document.getElementById('chapters-grid');
            let html = '';
            
            for(let i = 1; i <= TOTAL_CHAPTERS; i++) {
                const chapterStart = (i - 1) * LEVELS_PER_CHAPTER;
                const isUnlocked = (i === 1) || (unlockedLevels > chapterStart);
                
                let solvedInChapter = 0;
                for (let lvl = chapterStart + 1; lvl <= chapterStart + LEVELS_PER_CHAPTER; lvl++) {
                    if (lvl < unlockedLevels) solvedInChapter++;
                }
                const percent = (solvedInChapter / LEVELS_PER_CHAPTER) * 100;
                
                let stageText = "";
                if (i === 1) stageText = "مرحله ۱ تا ۱۵";
                else if (i === 2) stageText = "مرحله ۱۶ تا ۳۰";
                else if (i === 3) stageText = "مرحله ۳۱ تا ۴۵";
                
                if (isUnlocked) {
                    html += `
                        <div class="chapter-card" onclick="openChapter(${i})">
                            <h3>فصل ${i}</h3>
                            <p>${stageText}</p>
                            ${buildProgressRing(percent)}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="chapter-card locked">
                            <h3>فصل ${i}</h3>
                            <p>${stageText}</p>
                            <span class="lock-icon">${ICONS.lock}</span>
                        </div>
                    `;
                }
            }
            chaptersGrid.innerHTML = html;
        }

        function openChapter(chapterNum) {
            document.getElementById('level-header-title').innerText = `فصل ${chapterNum}`;
            showScreen('levels-screen');
        }

        function renderLevels() {
            const levelsGrid = document.getElementById('levels-grid');
            levelsGrid.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const levelDiv = document.createElement('div');
                levelDiv.className = 'level-card';
                
                if (i > unlockedLevels) {
                    levelDiv.classList.add('locked');
                    levelDiv.innerHTML = `<span>${i}</span><span class="lock-icon">${ICONS.lock}</span>`;
                } else {
                    if (i < unlockedLevels) {
                        levelDiv.classList.add('completed');
                        levelDiv.innerHTML = `<span>${i}</span><span class="level-completed-icon">${ICONS.check}</span>`;
                    } else {
                        levelDiv.classList.add('active-level');
                        levelDiv.innerHTML = `<span>${i}</span>`;
                    }
                    levelDiv.onclick = () => startLevel(i - 1);
                }
                levelsGrid.appendChild(levelDiv);
            }
            
            const progress = ((unlockedLevels - 1) / TOTAL_LEVELS) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${unlockedLevels - 1} از ${TOTAL_LEVELS} مرحله حل شده`;
        }

        function startLevel(index) {
            currentLevelIndex = index;
            const levelData = gameData[index];
            
            document.getElementById('game-level').innerText = `مرحله ${index + 1}`;
            
            const emojiContainer = document.getElementById('emoji-question');
            emojiContainer.innerHTML = levelData.emojis.map(e => `<span>${e}</span>`).join('');
            
            currentWord = levelData.letters;
            currentGuess = new Array(currentWord.length).fill('');
            
            renderSlots();
            renderKeyboard();
            
            showScreen('game-screen');
        }

        function renderSlots() {
            const slotsContainer = document.getElementById('answer-slots');
            slotsContainer.innerHTML = '';
            currentGuess.forEach((letter, index) => {
                if (currentWord[index] === ' ') {
                    const spacer = document.createElement('div');
                    spacer.className = 'slot-spacer';
                    slotsContainer.appendChild(spacer);
                } else {
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.innerText = letter;
                    slot.onclick = () => removeLetter(index);
                    slotsContainer.appendChild(slot);
                }
            });
        }

        function getAvailableLetters(wordArr) {
            let letters = wordArr.filter(c => c !== ' ');
            const extraPool = ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ح', 'ژ', 'چ', 'پ', 'گ', 'ک', 'م', 'ط', 'ظ', 'ذ', 'ز', 'ی', 'س', 'ش', 'ل', 'ت', 'ب'];
            let extraCount = 3; 
            let shuffled = extraPool.sort(() => 0.5 - Math.random());
            for(let char of shuffled) {
                if(!letters.includes(char) && extraCount > 0) {
                    letters.push(char);
                    extraCount--;
                }
            }
            return letters.sort(() => 0.5 - Math.random());
        }

        function renderKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            const keys = getAvailableLetters(currentWord);
            
            keys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'key';
                btn.innerText = key;
                btn.onclick = () => handleKeyPress(key, btn);
                keyboard.appendChild(btn);
            });
        }

        function handleKeyPress(letter, btnElement) {
            let emptyIndex = -1;
            for (let i = 0; i < currentGuess.length; i++) {
                if (currentGuess[i] === '' && currentWord[i] !== ' ') {
                    emptyIndex = i;
                    break;
                }
            }
            if (emptyIndex !== -1) {
                currentGuess[emptyIndex] = letter;
                renderSlots();
                btnElement.classList.add('used');
                
                const allFilled = currentGuess.every((g, i) => g !== '' || currentWord[i] === ' ');
                if (allFilled) {
                    checkAnswer();
                }
            }
        }

        function removeLetter(index) {
            if (currentGuess[index] !== '' && currentWord[index] !== ' ') {
                const letter = currentGuess[index];
                currentGuess[index] = '';
                renderSlots();
                
                document.querySelectorAll('.key').forEach(k => {
                    if(k.innerText === letter) k.classList.remove('used');
                });
            }
        }

        function checkAnswer() {
            const guessString = currentGuess.join('');
            const correctAnswer = gameData[currentLevelIndex].answer;
            
            if (guessString === correctAnswer) {
                const alreadySolved = localStorage.getItem('emojiGameSolved_' + currentLevelIndex) === '1';
                if (!alreadySolved) {
                    currentCoins += 10;
                    localStorage.setItem('emojiGameSolved_' + currentLevelIndex, '1');
                }
                if (currentLevelIndex + 1 === unlockedLevels && unlockedLevels < TOTAL_LEVELS) {
                    unlockedLevels++;
                }
                localStorage.setItem('emojiGameCoins', currentCoins);
                localStorage.setItem('emojiGameUnlocked', unlockedLevels);
                updateCoinsUI();
                
                document.getElementById('correct-answer-text').innerText = correctAnswer;
                document.getElementById('win-modal').classList.add('active');
            } else {
                const board = document.querySelector('.emoji-board');
                board.classList.add('shake-anim');
                setTimeout(() => {
                    board.classList.remove('shake-anim');
                    currentGuess = new Array(currentWord.length).fill('');
                    renderSlots();
                    document.querySelectorAll('.key').forEach(k => k.classList.remove('used'));
                }, 400);
            }
        }

        function nextLevel() {
            document.getElementById('win-modal').classList.remove('active');
            if (currentLevelIndex < TOTAL_LEVELS - 1) {
                startLevel(currentLevelIndex + 1);
            } else {
                showScreen('levels-screen');
            }
        }

        function buyHint(type) {
            let cost = 0;
            if(type === 'remove') cost = 25;
            if(type === 'letter') cost = 5;
            if(type === 'reveal') cost = 50;
            
            if(currentCoins >= cost) {
                currentCoins -= cost;
                updateCoinsUI();
                localStorage.setItem('emojiGameCoins', currentCoins);
                
                if(type === 'reveal') {
                    currentGuess = [...currentWord];
                    renderSlots();
                    checkAnswer();
                } else if (type === 'letter') {
                    let emptyIndex = -1;
                    for (let i = 0; i < currentGuess.length; i++) {
                        if (currentGuess[i] === '' && currentWord[i] !== ' ') {
                            emptyIndex = i;
                            break;
                        }
                    }
                    if(emptyIndex !== -1) {
                        const correctLetter = currentWord[emptyIndex];
                        currentGuess[emptyIndex] = correctLetter;
                        renderSlots();
                        document.querySelectorAll('.key').forEach(k => {
                            if(k.innerText === correctLetter) k.classList.add('used');
                        });
                        const allFilled = currentGuess.every((g, i) => g !== '' || currentWord[i] === ' ');
                        if (allFilled) checkAnswer();
                    }
                } else if (type === 'remove') {
                    const keys = document.querySelectorAll('.key:not(.used)');
                    let removed = 0;
                    keys.forEach(k => {
                        if(removed < 3 && !currentWord.includes(k.innerText)) {
                            k.classList.add('used');
                            removed++;
                        }
                    });
                }
            } else {
                alert('سکه کافی نداری!');
            }
        }

        renderChapters();
        updateCoinsUI();
    </script>
